<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <radialGradient id="body" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#c3e37f"/>
      <stop offset="70%" stop-color="#94c94c"/>
      <stop offset="100%" stop-color="#7cb43c"/>
    </radialGradient>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <path id="eyeShape" d="M-6,4 Q-8,-2 -4,-4 Q-1,-6 0,-3 Q2,-5 4,-3 Q6,-2 3,0 Q5,6 0,8 Q-5,9 -6,4 Z" fill="#33421c"/>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="196" rx="52" ry="10" fill="#000000" opacity="0.18"/>

  <!-- soft fuzzy glow halo -->
  <circle cx="100" cy="104" r="76" fill="#94c94c" opacity="0.55" filter="url(#halo)"/>

  <!-- round, flat, pastel moss body -->
  <circle cx="100" cy="104" r="74" fill="url(#body)"/>

  <!-- faint mottling, very subtle -->
  <g opacity="0.15" fill="#5f9430">
    <circle cx="145" cy="80" r="9"/>
    <circle cx="60" cy="140" r="7"/>
    <circle cx="150" cy="140" r="6"/>
  </g>

  <!-- face -->
  <use href="#eyeShape" transform="translate(85,104)"/>
  <use href="#eyeShape" transform="translate(115,104) scale(-1,1)"/>
  <path d="M92,120 Q96,125 100,120 Q104,125 108,120" stroke="#33421c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- gentle highlight -->
  <ellipse cx="68" cy="58" rx="16" ry="10" fill="#ffffff" opacity="0.35"/>
</svg>
