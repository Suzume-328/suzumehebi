<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ふたりのマリモ</title>
<style>
  /* ---------- 基本設定 ---------- */
  :root{
    --water-green: 46, 125, 90;      /* 水オーバーレイの緑色 */
    --yamato-color: #6fb8e8;         /* ヤマト側の色（青系） */
    --sakura-color: #f4a3b8;         /* さくら側の色（ピンク系） */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior-y: contain;
    touch-action: manipulation;
    background: #000;
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    color: #fff;
  }

  #app{
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    isolation: isolate; /* 子要素のz-indexを閉じ込める */
  }

  .layer{
    position: absolute;
    inset: 0;
  }

  /* ---------- 背景写真 ---------- */
  #bg-photo{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 60%;
  }

  /* ---------- 水レイヤー（半透明の緑オーバーレイ + ゆらぎ） ---------- */
  #water-layer{
    pointer-events: none;
    background:
      radial-gradient(ellipse 120% 80% at 30% 20%, rgba(var(--water-green), 0.28), transparent 60%),
      radial-gradient(ellipse 120% 80% at 70% 80%, rgba(var(--water-green), 0.30), transparent 60%),
      linear-gradient(180deg, rgba(var(--water-green), 0.22), rgba(var(--water-green), 0.38));
    background-size: 200% 200%, 200% 200%, 100% 100%;
    background-position: 0% 0%, 100% 100%, 0 0;
    mix-blend-mode: normal;
    animation: water-drift 9s ease-in-out infinite;
    transition: opacity 1.5s ease, background-color 1.5s ease;
  }
  /* SVGの乱流フィルターで水面のゆらぎを表現（ぼかしではなく歪み） */
  #water-layer::after{
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(var(--water-green), 0.10);
    filter: url(#water-ripple);
    animation: water-drift 6s ease-in-out infinite reverse;
  }
  @keyframes water-drift{
    0%   { background-position: 0% 0%, 100% 100%, 0 0; }
    50%  { background-position: 40% 30%, 60% 70%, 0 0; }
    100% { background-position: 0% 0%, 100% 100%, 0 0; }
  }
  /* 水が澄んだ状態 */
  #water-layer.clear{
    opacity: 0;
  }

  /* ---------- 光の粒（水が澄んだときに上昇） ---------- */
  #light-particles{
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease 0.9s;
  }
  #light-particles.show{ opacity: 1; }
  .particle{
    position: absolute;
    bottom: -5%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, rgba(255,255,255,0));
    opacity: 0;
    animation: particle-rise 4.5s ease-in infinite;
  }
  @keyframes particle-rise{
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    10%  { opacity: 0.9; }
    80%  { opacity: 0.6; }
    100% { transform: translateY(-110dvh) scale(1.1); opacity: 0; }
  }

  /* ---------- マリモ ---------- */
  #marimo-wrap{
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #marimo-float{
    animation: marimo-bob 4s ease-in-out infinite;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.35));
  }
  @keyframes marimo-bob{
    0%   { transform: translateY(0px) rotate(-2deg); }
    50%  { transform: translateY(-16px) rotate(2deg); }
    100% { transform: translateY(0px) rotate(-2deg); }
  }

  /* ---------- 上部UI ---------- */
  #top-ui{
    padding-top: calc(var(--safe-t) + 14px);
    padding-left: calc(var(--safe-l) + 20px);
    padding-right: calc(var(--safe-r) + 20px);
  }
  .gradient-top{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 160px;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
    pointer-events: none;
  }
  .title-box{
    position: relative;
    text-align: center;
  }
  .title-box .main{
    font-size: 15px;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .title-box .main strong{
    font-size: 19px;
    margin: 0 2px;
  }
  .title-box .sub{
    margin-top: 4px;
    font-size: 13px;
    opacity: 0.9;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  /* ---------- 下部UI ---------- */
  #bottom-ui{
    top: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: calc(var(--safe-b) + 16px);
    padding-left: calc(var(--safe-l) + 20px);
    padding-right: calc(var(--safe-r) + 20px);
  }
  .gradient-bottom{
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 260px;
    background: linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0));
    pointer-events: none;
  }

  .gauge-row{
    position: relative;
    display: flex;
    gap: 10px;
    height: 64px;
    margin-bottom: 10px;
  }
  .gauge{
    position: relative;
    flex: 1;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: none; /* ぼかし不使用 */
  }
  .gauge .fill{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    transition: height 1s cubic-bezier(.22,.9,.4,1);
  }
  .gauge.yamato .fill{ background: linear-gradient(180deg, rgba(111,184,232,0.55), rgba(111,184,232,0.85)); }
  .gauge.sakura .fill{ background: linear-gradient(180deg, rgba(244,163,184,0.55), rgba(244,163,184,0.85)); }
  .gauge .fill::before{
    /* 水面の揺れる縁 */
    content: "";
    position: absolute;
    top: -3px; left: 0; right: 0; height: 6px;
    background: rgba(255,255,255,0.55);
    animation: fill-shimmer 2.2s ease-in-out infinite;
  }
  @keyframes fill-shimmer{
    0%, 100% { transform: translateX(-4%); opacity: 0.7; }
    50%      { transform: translateX(4%); opacity: 1; }
  }
  .gauge .label{
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }
  /* 波紋アニメーション */
  .ripple{
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    left: 50%;
    bottom: 6px;
    transform: translate(-50%, 0) scale(0);
    background: rgba(255,255,255,0.7);
    pointer-events: none;
    animation: ripple-anim 0.9s ease-out forwards;
  }
  @keyframes ripple-anim{
    0%   { transform: translate(-50%, 0) scale(0);   opacity: 0.8; }
    100% { transform: translate(-50%, 0) scale(9);   opacity: 0; }
  }

  .log-box{
    font-size: 12.5px;
    opacity: 0.92;
    margin-bottom: 12px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    min-height: 16px;
  }
  .log-box .name{ font-weight: 700; margin-right: 6px; }
  .log-box .time{ opacity: 0.8; margin-right: 6px; }

  #water-btn{
    width: 100%;
    padding: 15px 0;
    font-size: 16px;
    font-weight: 700;
    color: #14382c;
    background: linear-gradient(180deg, #eafff2, #bdeccd);
    border: none;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    cursor: pointer;
  }
  #water-btn:active{ transform: scale(0.97); }
  #water-btn:disabled{
    opacity: 0.55;
    filter: grayscale(0.3);
  }

  #test-btn{
    width: 100%;
    margin-top: 8px;
    padding: 9px 0;
    font-size: 12px;
    color: #fff;
    background: rgba(0,0,0,0.35);
    border: 1px dashed rgba(255,255,255,0.5);
    border-radius: 999px;
    cursor: pointer;
  }

  /* ---------- コメント入力シート ---------- */
  #sheet-backdrop{
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #sheet-backdrop.show{ opacity: 1; pointer-events: auto; }

  #comment-sheet{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 20px calc(var(--safe-b) + 18px);
    background: #1c2b24;
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.22,.9,.4,1);
    box-shadow: 0 -6px 24px rgba(0,0,0,0.4);
  }
  #comment-sheet.show{ transform: translateY(0); }
  #comment-sheet h3{
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
  }
  #comment-input{
    width: 100%;
    height: 64px;
    resize: none;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    padding: 10px 12px;
    font-family: inherit;
  }
  #comment-input::placeholder{ color: rgba(255,255,255,0.45); }
  .sheet-actions{
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .sheet-actions button{
    flex: 1;
    padding: 12px 0;
    border-radius: 999px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  #send-btn{ background: #bdeccd; color: #14382c; }
  #cancel-btn{ background: rgba(255,255,255,0.12); color: #fff; }

</style>
</head>
<body>

<div id="app">

  <!-- 背景写真（今はダミー画像） -->
  <img id="bg-photo" src="https://picsum.photos/seed/marimo-lake/900/1600" alt="">

  <!-- 水レイヤー -->
  <div id="water-layer" class="layer"></div>

  <!-- 光の粒（水が澄んだ時に上昇） -->
  <div id="light-particles" class="layer"></div>

  <!-- マリモ本体 -->
  <div id="marimo-wrap" class="layer">
    <svg id="marimo-float" width="150" height="150" viewBox="0 0 150 150">
      <defs>
        <radialGradient id="marimo-body" cx="38%" cy="32%" r="75%">
          <stop offset="0%"  stop-color="#7fbf6a"/>
          <stop offset="45%" stop-color="#4f9a45"/>
          <stop offset="100%" stop-color="#2c6b34"/>
        </radialGradient>
        <filter id="moss-texture" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7" result="noise"/>
          <feColorMatrix in="noise" type="matrix"
            values="0 0 0 0 0.05
                    0 0 0 0 0.25
                    0 0 0 0 0.08
                    0 0 0 0.55 0"/>
        </filter>
        <clipPath id="marimo-clip">
          <circle cx="75" cy="75" r="62"/>
        </clipPath>
      </defs>
      <!-- 影 -->
      <ellipse cx="75" cy="128" rx="46" ry="9" fill="rgba(0,0,0,0.25)"/>
      <!-- 本体 -->
      <circle cx="75" cy="75" r="62" fill="url(#marimo-body)"/>
      <!-- モスの質感 -->
      <g clip-path="url(#marimo-clip)">
        <rect x="13" y="13" width="124" height="124" filter="url(#moss-texture)"/>
      </g>
      <!-- ハイライト -->
      <ellipse cx="55" cy="48" rx="20" ry="13" fill="rgba(255,255,255,0.28)"/>
    </svg>
  </div>

  <!-- 水面のゆらぎ用フィルター定義（非表示SVG） -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="water-ripple">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="3" result="noise">
        <animate attributeName="baseFrequency" values="0.012 0.03;0.02 0.045;0.012 0.03" dur="8s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="30"/>
    </filter>
  </svg>

  <!-- 上部UI -->
  <div id="top-ui" class="layer">
    <div class="gradient-top"></div>
    <div class="title-box">
      <div class="main">一緒に育てて <strong id="day-count">128</strong>日目</div>
      <div class="sub"><span id="marimo-color">みどり</span> <span id="marimo-size">42</span>mm</div>
    </div>
  </div>

  <!-- 下部UI -->
  <div id="bottom-ui" class="layer">
    <div class="gradient-bottom"></div>

    <div class="gauge-row" id="gauge-row">
      <div class="gauge yamato" id="gauge-yamato">
        <div class="fill" id="fill-yamato" style="height:0%"></div>
        <div class="label">ヤマト</div>
      </div>
      <div class="gauge sakura" id="gauge-sakura">
        <div class="fill" id="fill-sakura" style="height:0%"></div>
        <div class="label">さくら</div>
      </div>
    </div>

    <div class="log-box" id="log-box">
      <span class="name">さくら</span><span class="time">7:12</span><span class="text">「今日は雨だね」</span>
    </div>

    <button id="water-btn">水をあげる</button>
    <button id="test-btn">（テスト）相手が水をあげた</button>
  </div>

  <!-- コメント入力シート -->
  <div id="sheet-backdrop" class="layer"></div>
  <div id="comment-sheet">
    <h3>ひとこと残す（省略OK）</h3>
    <textarea id="comment-input" placeholder="今日のひとこと…"></textarea>
    <div class="sheet-actions">
      <button id="cancel-btn">キャンセル</button>
      <button id="send-btn">送る</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- 状態（保存なし・リロードで初期化） ----------
  // 今回のモックでは「自分 = ヤマト」固定。あとでSupabase連携時にログイン情報で置き換える。
  const ME = "yamato";

  const state = {
    day: 128,
    colorName: "みどり",
    sizeMm: 42,
    watered: { yamato: false, sakura: false },
    logs: [{ name: "さくら", time: "7:12", text: "今日は雨だね" }],
    cleared: false // 二人分揃って水が澄んだかどうか
  };

  // ---------- 要素参照 ----------
  const el = {
    dayCount: document.getElementById("day-count"),
    waterLayer: document.getElementById("water-layer"),
    particles: document.getElementById("light-particles"),
    gaugeRow: document.getElementById("gauge-row"),
    fillYamato: document.getElementById("fill-yamato"),
    fillSakura: document.getElementById("fill-sakura"),
    gaugeYamato: document.getElementById("gauge-yamato"),
    gaugeSakura: document.getElementById("gauge-sakura"),
    logBox: document.getElementById("log-box"),
    waterBtn: document.getElementById("water-btn"),
    testBtn: document.getElementById("test-btn"),
    sheetBackdrop: document.getElementById("sheet-backdrop"),
    sheet: document.getElementById("comment-sheet"),
    input: document.getElementById("comment-input"),
    sendBtn: document.getElementById("send-btn"),
    cancelBtn: document.getElementById("cancel-btn"),
  };

  el.dayCount.textContent = state.day;

  // ---------- 光の粒を生成 ----------
  function buildParticles(){
    const count = 18;
    for(let i = 0; i < count; i++){
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = (Math.random() * 90 + 5) + "%";
      p.style.animationDelay = (Math.random() * 4.5) + "s";
      p.style.animationDuration = (3.5 + Math.random() * 2.5) + "s";
      el.particles.appendChild(p);
    }
  }
  buildParticles();

  // ---------- ログ描画 ----------
  function renderLatestLog(){
    const last = state.logs[state.logs.length - 1];
    if(!last){ el.logBox.innerHTML = ""; return; }
    el.logBox.innerHTML =
      '<span class="name">' + last.name + '</span>' +
      '<span class="time">' + last.time + '</span>' +
      '<span class="text">' + (last.text ? "「" + last.text + "」" : "（コメントなし）") + '</span>';
  }
  renderLatestLog();

  function nowLabel(){
    const d = new Date();
    const h = String(d.getHours()).padStart(2, "0");
    const m = String(d.getMinutes()).padStart(2, "0");
    return h + ":" + m;
  }

  // ---------- 波紋アニメーション ----------
  function showRipple(gaugeEl){
    const r = document.createElement("div");
    r.className = "ripple";
    gaugeEl.appendChild(r);
    r.addEventListener("animationend", () => r.remove());
  }

  // ---------- 水やり処理 ----------
  function water(person, name, text){
    if(state.watered[person]) return;
    state.watered[person] = true;

    const fillEl = person === "yamato" ? el.fillYamato : el.fillSakura;
    const gaugeEl = person === "yamato" ? el.gaugeYamato : el.gaugeSakura;
    fillEl.style.height = "100%";
    showRipple(gaugeEl);

    state.logs.push({ name: name, time: nowLabel(), text: text || "" });
    renderLatestLog();

    if(person === ME){
      el.waterBtn.disabled = true;
      el.waterBtn.textContent = "今日は水やり済み";
    }

    checkBothWatered();
  }

  // ---------- 二人分揃ったら水を澄ませる ----------
  function checkBothWatered(){
    if(state.cleared) return;
    if(state.watered.yamato && state.watered.sakura){
      state.cleared = true;
      setTimeout(() => {
        el.waterLayer.classList.add("clear");
        el.particles.classList.add("show");
      }, 250); // 両方揃った余韻を少し置いてから澄ませる
    }
  }

  // ---------- コメントシートの開閉 ----------
  function openSheet(){
    el.input.value = "";
    el.sheetBackdrop.classList.add("show");
    el.sheet.classList.add("show");
    setTimeout(() => el.input.focus(), 250);
  }
  function closeSheet(){
    el.sheetBackdrop.classList.remove("show");
    el.sheet.classList.remove("show");
  }

  // ---------- イベント ----------
  el.waterBtn.addEventListener("click", () => {
    if(state.watered[ME]) return;
    openSheet();
  });

  el.cancelBtn.addEventListener("click", closeSheet);
  el.sheetBackdrop.addEventListener("click", closeSheet);

  el.sendBtn.addEventListener("click", () => {
    const text = el.input.value.trim();
    closeSheet();
    water(ME, "ヤマト", text); // 入力は任意。空でも送信可
  });

  // テスト用：相手（さくら）が水をあげた状態を再現
  el.testBtn.addEventListener("click", () => {
    if(state.watered.sakura) return;
    water("sakura", "さくら", "今日もよろしくね");
  });

})();
</script>

</body>
</html>
