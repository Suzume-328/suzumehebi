<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ふたりのマリモ</title>
<style>
  /* ---------- 基本設定 ---------- */
  :root{
    --water-green: 46, 125, 90;      /* 水オーバーレイの緑色 */
    --yamato-color: #6fb8e8;         /* ヤマト側の色（青系） */
    --sakura-color: #f4a3b8;         /* さくら側の色（ピンク系） */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior-y: contain;
    touch-action: manipulation;
    background: #000;
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    color: #fff;
  }

  #app{
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    isolation: isolate; /* 子要素のz-indexを閉じ込める */
  }

  .layer{
    position: absolute;
    inset: 0;
  }

  /* ---------- 背景写真 ---------- */
  #bg-photo{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 60%;
  }

  /* ---------- 水レイヤー（半透明の緑オーバーレイ + ゆらぎ） ---------- */
  #water-layer{
    pointer-events: none;
    background:
      radial-gradient(ellipse 120% 80% at 30% 20%, rgba(var(--water-green), 0.28), transparent 60%),
      radial-gradient(ellipse 120% 80% at 70% 80%, rgba(var(--water-green), 0.30), transparent 60%),
      linear-gradient(180deg, rgba(var(--water-green), 0.22), rgba(var(--water-green), 0.38));
    background-size: 200% 200%, 200% 200%, 100% 100%;
    background-position: 0% 0%, 100% 100%, 0 0;
    mix-blend-mode: normal;
    animation: water-drift 9s ease-in-out infinite;
    transition: opacity 1.5s ease, background-color 1.5s ease;
  }
  /* SVGの乱流フィルターで水面のゆらぎを表現（ぼかしではなく歪み） */
  #water-layer::after{
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(var(--water-green), 0.10);
    filter: url(#water-ripple);
    animation: water-drift 6s ease-in-out infinite reverse;
  }
  @keyframes water-drift{
    0%   { background-position: 0% 0%, 100% 100%, 0 0; }
    50%  { background-position: 40% 30%, 60% 70%, 0 0; }
    100% { background-position: 0% 0%, 100% 100%, 0 0; }
  }
  /* 水が澄んだ状態 */
  #water-layer.clear{
    opacity: 0;
  }

  /* ---------- 光の粒（水が澄んだときに上昇） ---------- */
  #light-particles{
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease 0.9s;
  }
  #light-particles.show{ opacity: 1; }
  .particle{
    position: absolute;
    bottom: -5%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, rgba(255,255,255,0));
    opacity: 0;
    animation: particle-rise 4.5s ease-in infinite;
  }
  @keyframes particle-rise{
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    10%  { opacity: 0.9; }
    80%  { opacity: 0.6; }
    100% { transform: translateY(-110dvh) scale(1.1); opacity: 0; }
  }

  /* ---------- マリモ ---------- */
  #marimo-wrap{
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #marimo-float{
    animation: marimo-bob 4s ease-in-out infinite;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.35));
  }
  @keyframes marimo-bob{
    0%   { transform: translateY(0px) rotate(-2deg); }
    50%  { transform: translateY(-16px) rotate(2deg); }
    100% { transform: translateY(0px) rotate(-2deg); }
  }

  /* ---------- 上部UI ---------- */
  #top-ui{
    padding-top: calc(var(--safe-t) + 14px);
    padding-left: calc(var(--safe-l) + 20px);
    padding-right: calc(var(--safe-r) + 20px);
  }
  .gradient-top{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 160px;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
    pointer-events: none;
  }
  .title-box{
    position: relative;
    text-align: center;
  }
  .title-box .main{
    font-size: 15px;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .title-box .main strong{
    font-size: 19px;
    margin: 0 2px;
  }
  .title-box .sub{
    margin-top: 4px;
    font-size: 13px;
    opacity: 0.9;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  /* ---------- 下部UI ---------- */
  #bottom-ui{
    top: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: calc(var(--safe-b) + 16px);
    padding-left: calc(var(--safe-l) + 20px);
    padding-right: calc(var(--safe-r) + 20px);
  }
  .gradient-bottom{
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 260px;
    background: linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0));
    pointer-events: none;
  }

  .gauge-row{
    position: relative;
    display: flex;
    gap: 10px;
    height: 64px;
    margin-bottom: 10px;
  }
  .gauge{
    position: relative;
    flex: 1;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: none; /* ぼかし不使用 */
  }
  .gauge .fill{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    transition: height 1s cubic-bezier(.22,.9,.4,1);
  }
  .gauge.yamato .fill{ background: linear-gradient(180deg, rgba(111,184,232,0.55), rgba(111,184,232,0.85)); }
  .gauge.sakura .fill{ background: linear-gradient(180deg, rgba(244,163,184,0.55), rgba(244,163,184,0.85)); }
  .gauge .fill::before{
    /* 水面の揺れる縁 */
    content: "";
    position: absolute;
    top: -3px; left: 0; right: 0; height: 6px;
    background: rgba(255,255,255,0.55);
    animation: fill-shimmer 2.2s ease-in-out infinite;
  }
  @keyframes fill-shimmer{
    0%, 100% { transform: translateX(-4%); opacity: 0.7; }
    50%      { transform: translateX(4%); opacity: 1; }
  }
  .gauge .label{
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }
  /* 波紋アニメーション */
  .ripple{
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    left: 50%;
    bottom: 6px;
    transform: translate(-50%, 0) scale(0);
    background: rgba(255,255,255,0.7);
    pointer-events: none;
    animation: ripple-anim 0.9s ease-out forwards;
  }
  @keyframes ripple-anim{
    0%   { transform: translate(-50%, 0) scale(0);   opacity: 0.8; }
    100% { transform: translate(-50%, 0) scale(9);   opacity: 0; }
  }

  .log-box{
    font-size: 12.5px;
    opacity: 0.92;
    margin-bottom: 12px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    min-height: 16px;
  }
  .log-box .name{ font-weight: 700; margin-right: 6px; }
  .log-box .time{ opacity: 0.8; margin-right: 6px; }

  #water-btn{
    width: 100%;
    padding: 15px 0;
    font-size: 16px;
    font-weight: 700;
    color: #14382c;
    background: linear-gradient(180deg, #eafff2, #bdeccd);
    border: none;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    cursor: pointer;
  }
  #water-btn:active{ transform: scale(0.97); }
  #water-btn:disabled{
    opacity: 0.55;
    filter: grayscale(0.3);
  }

  #test-btn{
    width: 100%;
    margin-top: 8px;
    padding: 9px 0;
    font-size: 12px;
    color: #fff;
    background: rgba(0,0,0,0.35);
    border: 1px dashed rgba(255,255,255,0.5);
    border-radius: 999px;
    cursor: pointer;
  }

  /* ---------- コメント入力シート ---------- */
  #sheet-backdrop{
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #sheet-backdrop.show{ opacity: 1; pointer-events: auto; }

  #comment-sheet{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 20px calc(var(--safe-b) + 18px);
    background: #1c2b24;
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.22,.9,.4,1);
    box-shadow: 0 -6px 24px rgba(0,0,0,0.4);
  }
  #comment-sheet.show{ transform: translateY(0); }
  #comment-sheet h3{
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
  }
  #comment-input{
    width: 100%;
    height: 64px;
    resize: none;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    padding: 10px 12px;
    font-family: inherit;
  }
  #comment-input::placeholder{ color: rgba(255,255,255,0.45); }
  .sheet-actions{
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .sheet-actions button{
    flex: 1;
    padding: 12px 0;
    border-radius: 999px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  #send-btn{ background: #bdeccd; color: #14382c; }
  #cancel-btn{ background: rgba(255,255,255,0.12); color: #fff; }

  /* ---------- ログイン画面 ---------- */
  #login-screen{
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--safe-t) + 24px) calc(var(--safe-r) + 24px) calc(var(--safe-b) + 24px) calc(var(--safe-l) + 24px);
    background: linear-gradient(160deg, #0d1f18, #142c22);
  }
  #login-screen.hide{ display: none; }
  #login-card{ width: 100%; max-width: 320px; }
  #login-card h1{
    font-size: 18px;
    margin: 0 0 20px;
    text-align: center;
    font-weight: 700;
  }
  #login-card input{
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  #login-card input::placeholder{ color: rgba(255,255,255,0.45); }
  #login-btn{
    width: 100%;
    padding: 13px 0;
    margin-top: 4px;
    font-size: 15px;
    font-weight: 700;
    color: #14382c;
    background: linear-gradient(180deg, #eafff2, #bdeccd);
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  #login-btn:disabled{ opacity: 0.55; }
  #login-error{
    min-height: 18px;
    margin-top: 10px;
    font-size: 12.5px;
    color: #ffb4b4;
    text-align: center;
  }
  #app.hide{ display: none; }

</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <form id="login-card">
    <h1>ふたりのマリモ</h1>
    <input type="email" id="login-email" placeholder="メールアドレス" autocomplete="username" required>
    <input type="password" id="login-password" placeholder="パスワード" autocomplete="current-password" required>
    <button type="submit" id="login-btn">ログイン</button>
    <div id="login-error"></div>
  </form>
</div>

<div id="app" class="hide">

  <!-- 背景写真（今はダミー画像） -->
  <img id="bg-photo" src="https://picsum.photos/seed/marimo-lake/900/1600" alt="">

  <!-- 水レイヤー -->
  <div id="water-layer" class="layer"></div>

  <!-- 光の粒（水が澄んだ時に上昇） -->
  <div id="light-particles" class="layer"></div>

  <!-- マリモ本体（さくらさん作成のイラストをインライン埋め込み） -->
  <div id="marimo-wrap" class="layer">
    <svg id="marimo-float" width="200" height="220" viewBox="0 0 200 220">
      <defs>
        <radialGradient id="marimo-body-gradient" cx="38%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#c3e37f"/>
          <stop offset="70%" stop-color="#94c94c"/>
          <stop offset="100%" stop-color="#7cb43c"/>
        </radialGradient>
        <filter id="marimo-halo" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
        <path id="marimo-eye" d="M-6,4 Q-8,-2 -4,-4 Q-1,-6 0,-3 Q2,-5 4,-3 Q6,-2 3,0 Q5,6 0,8 Q-5,9 -6,4 Z" fill="#33421c"/>
      </defs>

      <!-- 影 -->
      <ellipse cx="100" cy="196" rx="52" ry="10" fill="#000000" opacity="0.18"/>

      <!-- ふんわりした発光ハロー -->
      <circle cx="100" cy="104" r="76" fill="#94c94c" opacity="0.55" filter="url(#marimo-halo)"/>

      <!-- 丸くて平たい、パステルなモスの本体 -->
      <circle cx="100" cy="104" r="74" fill="url(#marimo-body-gradient)"/>

      <!-- 淡いまだら模様 -->
      <g opacity="0.15" fill="#5f9430">
        <circle cx="145" cy="80" r="9"/>
        <circle cx="60" cy="140" r="7"/>
        <circle cx="150" cy="140" r="6"/>
      </g>

      <!-- 顔 -->
      <use href="#marimo-eye" transform="translate(85,104)"/>
      <use href="#marimo-eye" transform="translate(115,104) scale(-1,1)"/>
      <path d="M92,120 Q96,125 100,120 Q104,125 108,120" stroke="#33421c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- ハイライト -->
      <ellipse cx="68" cy="58" rx="16" ry="10" fill="#ffffff" opacity="0.35"/>
    </svg>
  </div>

  <!-- 水面のゆらぎ用フィルター定義（非表示SVG） -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="water-ripple">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="3" result="noise">
        <animate attributeName="baseFrequency" values="0.012 0.03;0.02 0.045;0.012 0.03" dur="8s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="30"/>
    </filter>
  </svg>

  <!-- 上部UI -->
  <div id="top-ui" class="layer">
    <div class="gradient-top"></div>
    <div class="title-box">
      <div class="main">一緒に育てて <strong id="day-count">128</strong>日目</div>
      <div class="sub"><span id="marimo-color">みどり</span> <span id="marimo-size">42</span>mm</div>
    </div>
  </div>

  <!-- 下部UI -->
  <div id="bottom-ui" class="layer">
    <div class="gradient-bottom"></div>

    <div class="gauge-row" id="gauge-row">
      <div class="gauge yamato" id="gauge-yamato">
        <div class="fill" id="fill-yamato" style="height:0%"></div>
        <div class="label">ヤマト</div>
      </div>
      <div class="gauge sakura" id="gauge-sakura">
        <div class="fill" id="fill-sakura" style="height:0%"></div>
        <div class="label">さくら</div>
      </div>
    </div>

    <div class="log-box" id="log-box">
      <span class="name">さくら</span><span class="time">7:12</span><span class="text">「今日は雨だね」</span>
    </div>

    <button id="water-btn">水をあげる</button>
  </div>

  <!-- コメント入力シート -->
  <div id="sheet-backdrop" class="layer"></div>
  <div id="comment-sheet">
    <h3>ひとこと残す（省略OK）</h3>
    <textarea id="comment-input" placeholder="今日のひとこと…"></textarea>
    <div class="sheet-actions">
      <button id="cancel-btn">キャンセル</button>
      <button id="send-btn">送る</button>
    </div>
  </div>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ---------- Supabase設定 ----------
const SUPABASE_URL = "https://ndslunrqbesiawhaukel.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nCfstmQdjsy4quRwBnqbDA_AGESJE2e";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,   // セッションを永続化し、毎回のログインを不要にする
    autoRefreshToken: true, // アクセストークンを自動更新する
  },
});

// メールアドレス → actor 判定
const ACTOR_BY_EMAIL = {
  "yamato.shimobayashi328@gmail.com": "yamato",
  "bovida213@icloud.com": "sakura",
};
const ACTOR_NAME = { yamato: "ヤマト", sakura: "さくら" };

// 成長ロジック（その日水をあげた人数ごとの増分）
const GROWTH = {
  0: { mm: 0.1, q: -8 },
  1: { mm: 0.5, q: 25 },
  2: { mm: 1.5, q: 60 },
};

let ME = null; // ログイン後に "yamato" | "sakura" が入る

// ---------- 日付ユーティリティ（JST 午前4時境界） ----------
// local_date = 「現在時刻(JST) - 4時間」の日付部分
function getLocalDate(baseDate){
  const d = baseDate ? new Date(baseDate) : new Date();
  const shifted = new Date(d.getTime() - 4 * 60 * 60 * 1000);
  return shifted.toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
}
function addDaysToDateStr(dateStr, days){
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

// ---------- 要素参照 ----------
const el = {
  loginScreen: document.getElementById("login-screen"),
  loginForm: document.getElementById("login-card"),
  loginEmail: document.getElementById("login-email"),
  loginPassword: document.getElementById("login-password"),
  loginBtn: document.getElementById("login-btn"),
  loginError: document.getElementById("login-error"),
  app: document.getElementById("app"),
  dayCount: document.getElementById("day-count"),
  colorName: document.getElementById("marimo-color"),
  sizeLabel: document.getElementById("marimo-size"),
  marimoSvg: document.getElementById("marimo-float"),
  waterLayer: document.getElementById("water-layer"),
  particles: document.getElementById("light-particles"),
  fillYamato: document.getElementById("fill-yamato"),
  fillSakura: document.getElementById("fill-sakura"),
  gaugeYamato: document.getElementById("gauge-yamato"),
  gaugeSakura: document.getElementById("gauge-sakura"),
  logBox: document.getElementById("log-box"),
  waterBtn: document.getElementById("water-btn"),
  sheetBackdrop: document.getElementById("sheet-backdrop"),
  sheet: document.getElementById("comment-sheet"),
  input: document.getElementById("comment-input"),
  sendBtn: document.getElementById("send-btn"),
  cancelBtn: document.getElementById("cancel-btn"),
};

// ---------- 光の粒を生成 ----------
(function buildParticles(){
  const count = 18;
  for(let i = 0; i < count; i++){
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = (Math.random() * 90 + 5) + "%";
    p.style.animationDelay = (Math.random() * 4.5) + "s";
    p.style.animationDuration = (3.5 + Math.random() * 2.5) + "s";
    el.particles.appendChild(p);
  }
})();

// ---------- 波紋アニメーション ----------
function showRipple(gaugeEl){
  const r = document.createElement("div");
  r.className = "ripple";
  gaugeEl.appendChild(r);
  r.addEventListener("animationend", () => r.remove());
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

// ---------- マリモの見た目を反映 ----------
function renderMarimo(marimo){
  const sizeMm = marimo.size_mm;
  const q = marimo.water_quality;

  el.sizeLabel.textContent = Math.round(sizeMm * 10) / 10;
  // 水質スコアから色の呼び名を判定（しきい値は仮）
  el.colorName.textContent = q >= 70 ? "みどり" : (q >= 40 ? "くすみ" : "にごり");

  const vw = 8 + 52 * Math.sqrt(Math.max(0, sizeMm - 10) / 290);
  el.marimoSvg.style.width = vw + "vw";
  el.marimoSvg.style.height = vw + "vw";

  const started = new Date(marimo.started_on + "T00:00:00Z");
  const today = new Date(getLocalDate() + "T00:00:00Z");
  const days = Math.floor((today - started) / 86400000) + 1;
  el.dayCount.textContent = Math.max(1, days);
}

// ---------- 水位ゲージ・水の透明度を反映 ----------
function renderGauges(wateredSet){
  el.fillYamato.style.height = wateredSet.has("yamato") ? "100%" : "0%";
  el.fillSakura.style.height = wateredSet.has("sakura") ? "100%" : "0%";

  const bothToday = wateredSet.has("yamato") && wateredSet.has("sakura");
  el.waterLayer.classList.toggle("clear", bothToday);
  el.particles.classList.toggle("show", bothToday);

  if(wateredSet.has(ME)){
    el.waterBtn.disabled = true;
    el.waterBtn.textContent = "今日は水やり済み";
  } else {
    el.waterBtn.disabled = false;
    el.waterBtn.textContent = "水をあげる";
  }
}

// ---------- 最新ログを反映 ----------
function renderLatestLog(row){
  if(!row){ el.logBox.innerHTML = ""; return; }
  const time = new Date(row.created_at).toLocaleTimeString("ja-JP", {
    timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hour12: false
  });
  el.logBox.innerHTML =
    '<span class="name">' + ACTOR_NAME[row.actor] + "</span>" +
    '<span class="time">' + time + "</span>" +
    '<span class="text">' + (row.comment ? "「" + escapeHtml(row.comment) + "」" : "（コメントなし）") + "</span>";
}

// ---------- 指定日に水をあげたactorの集合を取得 ----------
async function fetchWateredActors(localDate){
  const { data, error } = await supabase
    .from("log")
    .select("actor")
    .eq("local_date", localDate)
    .eq("action", "water");
  if(error){ console.error(error); return new Set(); }
  return new Set((data || []).map(r => r.actor));
}

async function fetchLatestLog(){
  const { data, error } = await supabase
    .from("log")
    .select("actor, comment, created_at")
    .order("created_at", { ascending: false })
    .limit(1);
  if(error){ console.error(error); return null; }
  return data && data[0];
}

// ---------- 未精算の過去日を成長ロジックで精算する ----------
// marimo.updated_at の日付の翌日から「今日の前日」までを、その日の水やり人数(0/1/2)に応じて成長させる。
// 「今日」分は両者揃った瞬間にwater()側でリアルタイムに精算するので、ここでは対象にしない。
async function settlePastDays(marimo){
  const todayLd = getLocalDate();
  const baseDate = marimo.updated_at || (marimo.started_on + "T00:00:00Z");
  let cursor = addDaysToDateStr(getLocalDate(baseDate), 1);

  let sizeMm = marimo.size_mm;
  let quality = marimo.water_quality;
  let changed = false;
  let guard = 0;

  while(cursor < todayLd && guard < 3650){
    const watered = await fetchWateredActors(cursor);
    const n = Math.min(watered.size, 2);
    const delta = GROWTH[n];
    sizeMm += delta.mm;
    quality = clamp(quality + delta.q, 0, 100);
    changed = true;
    cursor = addDaysToDateStr(cursor, 1);
    guard++;
  }

  if(!changed) return marimo;

  const { data, error } = await supabase
    .from("marimo")
    .update({ size_mm: sizeMm, water_quality: quality, updated_at: new Date().toISOString() })
    .eq("id", 1)
    .select()
    .single();
  if(error){ console.error(error); return marimo; }
  return data;
}

// ---------- 画面全体を最新状態で描画 ----------
async function loadAndRender(){
  let { data: marimo, error: marimoErr } = await supabase.from("marimo").select("*").eq("id", 1).single();
  if(marimoErr){ console.error(marimoErr); return; }

  marimo = await settlePastDays(marimo);

  const watered = await fetchWateredActors(getLocalDate());
  const latest = await fetchLatestLog();

  renderMarimo(marimo);
  renderGauges(watered);
  renderLatestLog(latest);
}

// ---------- 水やり処理 ----------
async function water(comment){
  const todayLd = getLocalDate();

  const { error } = await supabase.from("log").insert({
    actor: ME, action: "water", comment: comment || null, local_date: todayLd,
  });
  if(error){
    console.error(error);
    alert("送信に失敗しました。もう一度お試しください。");
    return;
  }

  showRipple(ME === "yamato" ? el.gaugeYamato : el.gaugeSakura);

  const watered = await fetchWateredActors(todayLd);
  renderGauges(watered);
  renderLatestLog(await fetchLatestLog());

  // 自分の水やりで二人分揃った場合のみ、その場で成長を反映する
  if(watered.has("yamato") && watered.has("sakura")){
    const { data: marimo, error: marimoErr } = await supabase.from("marimo").select("*").eq("id", 1).single();
    if(!marimoErr && marimo){
      const delta = GROWTH[2];
      const newSize = marimo.size_mm + delta.mm;
      const newQuality = clamp(marimo.water_quality + delta.q, 0, 100);
      const { data: updated, error: updateErr } = await supabase
        .from("marimo")
        .update({ size_mm: newSize, water_quality: newQuality, updated_at: new Date().toISOString() })
        .eq("id", 1)
        .select()
        .single();
      if(!updateErr && updated) renderMarimo(updated);
    }
  }
}

// ---------- コメントシートの開閉 ----------
function openSheet(){
  el.input.value = "";
  el.sheetBackdrop.classList.add("show");
  el.sheet.classList.add("show");
  setTimeout(() => el.input.focus(), 250);
}
function closeSheet(){
  el.sheetBackdrop.classList.remove("show");
  el.sheet.classList.remove("show");
}

el.waterBtn.addEventListener("click", () => {
  if(el.waterBtn.disabled) return;
  openSheet();
});
el.cancelBtn.addEventListener("click", closeSheet);
el.sheetBackdrop.addEventListener("click", closeSheet);
el.sendBtn.addEventListener("click", () => {
  const text = el.input.value.trim();
  closeSheet();
  water(text); // 入力は任意。空でも送信可
});

// ---------- ログイン ----------
el.loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  el.loginError.textContent = "";
  el.loginBtn.disabled = true;

  const email = el.loginEmail.value.trim();
  const password = el.loginPassword.value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  el.loginBtn.disabled = false;

  if(error){
    el.loginError.textContent = "メールアドレスまたはパスワードが違います";
    return;
  }
  await enterApp(data.session);
});

async function enterApp(session){
  const actor = ACTOR_BY_EMAIL[session.user.email];
  if(!actor){
    el.loginError.textContent = "このアカウントは利用できません";
    await supabase.auth.signOut();
    return;
  }
  ME = actor;
  el.loginScreen.classList.add("hide");
  el.app.classList.remove("hide");
  await loadAndRender();
}

// ---------- 起動時：セッションがあればログイン画面をスキップ ----------
(async function init(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session) await enterApp(session);
})();
</script>
